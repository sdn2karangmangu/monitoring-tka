<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Nilai — Monitoring TKA Kelas VI SDN 2 Karangmangu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar no-print">
      <a href="dashboard.html" class="sidebar-brand">
        <img src="assets/logo-sdn2.svg" alt="SDN 2 Karangmangu">
        <div>
          <div class="sidebar-brand-title">MONITORING TKA</div>
          <div class="sidebar-brand-sub">SDN 2 Karangmangu</div>
        </div>
      </a>
      <nav id="sidebarNavLinks" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div id="sidebarUserNama" class="fw-semibold text-white text-truncate">-</div>
        <div id="sidebarUserRole" class="text-white-50 mb-2">-</div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-outline-light flex-fill" data-bs-toggle="modal" data-bs-target="#modalUbahPassword">Password</button>
          <button type="button" class="btn btn-sm btn-danger js-logout-btn">Keluar</button>
        </div>
      </div>
    </aside>

    <div class="offcanvas offcanvas-start no-print" tabindex="-1" id="mobileSidebarDrawer">
      <div class="offcanvas-header border-bottom border-secondary">
        <span class="fw-bold">MONITORING TKA · SDN 2</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Tutup"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column justify-content-between">
        <nav id="mobileNavLinks" class="sidebar-nav px-0"></nav>
        <div class="pt-3 border-top border-secondary d-flex gap-2">
          <button type="button" class="btn btn-sm btn-outline-light flex-fill" data-bs-toggle="modal" data-bs-target="#modalUbahPassword">Ubah Password</button>
          <button type="button" class="btn btn-sm btn-danger js-logout-btn">Keluar</button>
        </div>
      </div>
    </div>

    <div class="app-main">
      <header class="app-topbar no-print">
        <div class="topbar-title-group">
          <button type="button" class="btn-icon-square mobile-menu-btn" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebarDrawer" aria-label="Buka menu">
            <i data-lucide="menu"></i>
          </button>
          <h1 id="topbarPageTitle" class="topbar-title">Rekap Seluruh Nilai TKA</h1>
        </div>
        <div class="topbar-actions">
          <span id="topbarUserName" class="d-none d-md-inline small fw-semibold text-secondary"></span>
          <button type="button" class="btn-icon-square" id="btnThemeToggle" aria-label="Ganti tema">
            <i id="themeToggleIcon" data-lucide="moon"></i>
          </button>
        </div>
      </header>

      <main class="app-content">
        <div class="surface-card mb-4 no-print">
          <div class="surface-card-header">
            <h2 class="surface-card-title">Perbandingan Capaian Tryout Kelas VI</h2>
            <button type="button" id="btnRefreshRekap" class="btn btn-sm btn-outline-secondary">Muat Ulang</button>
          </div>
          <div class="chart-container-sm">
            <canvas id="chartRekapPerbandingan"></canvas>
          </div>
        </div>

        <div class="surface-card">
          <div class="surface-card-header">
            <div>
              <h2 class="surface-card-title">Tabel Rekap Nilai Seluruh Siswa</h2>
              <div id="rekapCountLabel" class="small text-secondary mt-1">Memuat data...</div>
            </div>
            <div class="d-flex flex-wrap gap-2 w-mobile-100 no-print">
              <button type="button" id="btnExportCsv" class="btn btn-sm btn-outline-success flex-fill flex-sm-grow-0">Export CSV / Excel</button>
              <button type="button" id="btnPrintRekap" class="btn btn-sm btn-navy flex-fill flex-sm-grow-0">Cetak Rekap</button>
            </div>
          </div>

          <div class="row g-2 mb-3 no-print">
            <div class="col-12 col-sm-6 col-lg-4">
              <input type="search" id="rekapSearch" class="form-control form-control-sm" placeholder="Cari nama atau NIS siswa...">
            </div>
            <div class="col-6 col-lg-2">
              <select id="rekapFilterKelas" class="form-select form-select-sm">
                <option value="">Semua Kelas</option>
              </select>
            </div>
            <div class="col-6 col-lg-3">
              <select id="rekapFilterMapel" class="form-select form-select-sm">
                <option value="">Semua Mata Pelajaran</option>
                <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                <option value="Matematika">Matematika</option>
              </select>
            </div>
            <div class="col-12 col-sm-6 col-lg-3">
              <select id="rekapSort" class="form-select form-select-sm">
                <option value="nama">Urutkan: Nama (A-Z)</option>
                <option value="rataRataDesc">Nilai Tertinggi</option>
                <option value="rataRataAsc">Nilai Terendah</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-clean">
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama</th>
                  <th>NIS</th>
                  <th>Kelas</th>
                  <th class="text-end">BI 1</th>
                  <th class="text-end">BI 2</th>
                  <th class="text-end">MTK 1</th>
                  <th class="text-end">MTK 2</th>
                  <th class="text-end">Rata-rata</th>
                  <th class="text-end">Progress</th>
                </tr>
              </thead>
              <tbody id="rekapTbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/rekap.js"></script>
</body>
</html>
